[workspace]
name = "hmftools-containers"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

# Java comes from the shared Temurin runtime image. Pixi owns the common process
# utilities and the native dependencies that distinguish one tool from another.
[dependencies]
procps-ng = "*"

[feature.copy-number.dependencies]
r-dplyr = "*"
bioconductor-copynumber = "*"

[feature.chord.dependencies]
r-base = "*"
r-randomforest = "*"

[feature.cider.dependencies]
blast = "*"

[feature.cuppa.dependencies]
unzip = "*"
python = "3.11.*"
pip = "*"
setuptools = "*"
pandas = "2.0.*"
numpy = "<2"
scikit-learn = "1.3.0.*"
r-ggplot2 = "*"
r-patchwork = "*"
r-reshape2 = "*"
r-ggh4x = "*"

[feature.qsee.dependencies]
r-dplyr = "*"
r-ggplot2 = "*"
r-patchwork = "*"
r-scales = "*"

[feature.r-visualization.dependencies]
xorg-libxtst = "*"
r-tidyr = "*"
r-dplyr = "*"
r-ggplot2 = "*"
r-cowplot = "*"
r-magick = "*"
bioconductor-gviz = "*"
circos = ">=0.69.9"
perl-config-general = "*"
perl-gd = ">=2.76"

[feature.redux.dependencies]
samtools = ">=1.14"
r-base = "*"
bioconductor-variantannotation = "*"
bioconductor-genomicranges = "*"
r-dplyr = "*"
r-tidyr = "*"
r-ggplot2 = "*"
r-patchwork = "*"
xorg-libxt = "*"
font-ttf-dejavu = "*"

[feature.sambamba.dependencies]
sambamba = ">=1.0.1"

[feature.taur.dependencies]
fastp = ">=1.1.0"

[feature.teal.dependencies]
samtools = ">=1.14"

[feature.wisp.dependencies]
r-tidyverse = "*"

# Environment names are Maven module names. Their presence here is the complete
# list of modules that publish a container image.
[environments]
amber = ["copy-number"]
bam-tools = ["sambamba"]
chord = ["chord"]
cider = ["cider"]
cobalt = ["copy-number"]
cuppa = ["cuppa"]
esvee = ["sambamba"]
gene-utils = []
isofox = []
lilac = []
linx = ["r-visualization"]
neo = []
orange = []
pave = []
peach = []
purple = ["r-visualization"]
qsee = ["qsee"]
redux = ["redux"]
sage = []
sigs = []
taur = ["taur"]
teal = ["teal"]
v-chord = []
virus-interpreter = []
wisp = ["wisp"]
