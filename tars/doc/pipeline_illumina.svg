<svg viewBox="0 0 880 134" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Illumina pipeline</title>
<desc>Paired-end FASTQ is aligned by bwa-mem2 with -Y -T 19 -h 75 against the genome plus transcriptome FASTA, TarsApplication lifts the reads back to the genome, REDUX merges duplicates with -form_consensus, then ISOFOX.</desc>
<style>
svg { font-family: Arial, Helvetica, sans-serif; }
svg {
  --tx-dark:#0C447C; --tx-deep:#1C4F7C; --exon:#E6F1FB; --exon-line:#4A90C4;
  --muted:#9B9893; --border2:#C7C5BF; --panel:#FCFCFB; --bg:#FFFFFF;
}
.bg      { fill:var(--bg); }
.node    { fill:var(--panel); stroke:var(--border2); stroke-width:1.2; }
.nodeadd { fill:var(--exon); stroke:var(--exon-line); stroke-width:1.4; }
.nodett  { font-size:12px; font-weight:600; fill:var(--tx-dark); text-anchor:middle; }
.nodesub { font-size:9px; fill:var(--muted); text-anchor:middle; }
.flag    { font-family:Menlo, Consolas, monospace; font-size:8.5px; fill:var(--tx-deep); text-anchor:middle; }
.note    { font-size:9.5px; fill:var(--muted); }
.arrline { stroke:var(--muted); stroke-width:1.4; }
</style>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#9B9893"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="880" height="134"/>

<rect class="node" x="22" y="20" width="108" height="84" rx="8"/>
<text class="nodett"  x="76" y="46">FASTQ</text>
<text class="nodesub" x="76" y="62">paired-end reads</text>

<rect class="node" x="150" y="20" width="164" height="84" rx="8"/>
<text class="nodett" x="232" y="46">bwa-mem2 mem</text>
<text class="flag"   x="232" y="62">-Y -T 19 -h 75</text>

<rect class="nodeadd" x="334" y="20" width="116" height="84" rx="8"/>
<text class="nodett"  x="392" y="46">TarsApplication</text>
<text class="nodesub" x="392" y="62">lift back to genome</text>

<rect class="node" x="470" y="20" width="132" height="84" rx="8"/>
<text class="nodett"  x="536" y="46">REDUX</text>
<text class="flag"    x="536" y="62">-form_consensus</text>
<text class="nodesub" x="536" y="74">merges duplicates</text>

<rect class="node" x="622" y="20" width="100" height="84" rx="8"/>
<text class="nodett" x="672" y="46">ISOFOX</text>

<line class="arrline" x1="130" y1="62" x2="150" y2="62" marker-end="url(#arr)"/>
<line class="arrline" x1="314" y1="62" x2="334" y2="62" marker-end="url(#arr)"/>
<line class="arrline" x1="450" y1="62" x2="470" y2="62" marker-end="url(#arr)"/>
<line class="arrline" x1="602" y1="62" x2="622" y2="62" marker-end="url(#arr)"/>

<text class="note" x="232" y="124" text-anchor="middle">against the genome + transcriptome FASTA</text>

<rect x="752" y="114" width="20" height="12" rx="2" fill="var(--exon)" stroke="var(--exon-line)"/>
<text class="note" x="778" y="124">added by TARS</text>
</svg>
